project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notes/**/*.qmd"
    - "!templates/"

lang: ko
date-format: "YYYY-MM-DD"

website:
  title: "Hyeongjin"
  description: "경제학 대학원생 Hyeongjin의 개인 연구 및 프로필 홈페이지"
  site-url: "https://hyeongjin3544.github.io/HyeongjinHome/"
  
  search:
    location: navbar
    type: overlay

  navbar:
    title: "Hyeongjin"
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Projects & Code"
        href: projects.qmd
      - text: "Notes"
        href: notes.qmd
      - text: "CV"
        href: cv.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/Hyeongjin3544
        aria-label: GitHub
      - icon: envelope
        href: mailto:your-email@example.com
        aria-label: Email

  page-footer:
    left: "© 2026 Hyeongjin. All rights reserved."
    center: "Economics Graduate Student"
    right: "[Source on GitHub](https://github.com/Hyeongjin3544/HyeongjinHome)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    toc-title: "목차"
    smooth-scroll: true
    code-fold: show
    code-tools: true
    code-copy: true
    highlight-style: github
