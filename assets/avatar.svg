<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="#f1f5f9" />
  <circle cx="100" cy="100" r="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Silhouette / Stylized Scholar -->
  <!-- Shoulders & Coat -->
  <path d="M 30 195 C 32 150, 65 140, 100 140 C 135 140, 168 150, 170 195 Z" fill="url(#shirtGrad)" />
  <!-- Tie / Lapel -->
  <polygon points="100,140 92,195 108,195" fill="#1e3a8a" opacity="0.9" />
  <polygon points="100,150 96,170 104,170" fill="#38bdf8" />
  
  <!-- Head & Neck -->
  <rect x="88" y="115" width="24" height="30" rx="6" fill="#fcd34d" />
  <circle cx="100" cy="90" r="38" fill="#fde68a" />
  
  <!-- Hair (Modern Neat Cut) -->
  <path d="M 62 85 C 62 60, 80 50, 100 50 C 120 50, 138 60, 138 85 C 138 90, 134 80, 128 75 C 118 70, 85 70, 72 78 C 66 82, 62 87, 62 85 Z" fill="#1e293b" />
  
  <!-- Glasses for Academic Vibe -->
  <circle cx="86" cy="90" r="10" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <circle cx="114" cy="90" r="10" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <line x1="96" y1="90" x2="104" y2="90" stroke="#1e293b" stroke-width="2.5" />
  
  <!-- Subtle smile -->
  <path d="M 94 107 Q 100 112 106 107" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
</svg>
